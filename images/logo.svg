<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="logo-titulo">
  <title id="logo-titulo">AquaPlan</title>
  <!-- Círculo de fondo -->
  <circle cx="100" cy="100" r="100" fill="#0E4A6B"/>
  <!-- Gota -->
  <path d="M100,24 C122,54 140,74 140,96 A40,40 0 0 1 60,96 C60,74 78,54 100,24 Z" fill="#FFFFFF"/>
  <!-- Hoja -->
  <g transform="translate(102,94) rotate(-35)">
