    <line x1="0" y1="-20" x2="0" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Punto amarillo -->
  <circle cx="132" cy="40" r="7" fill="#FDB813"/>
  <!-- Nombre -->
  <text x="100" y="166" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">AquaPlan</text>
